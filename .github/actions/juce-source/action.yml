name: JUCE source
description: >
  Restores the JUCE source that CMakeLists.txt asks for from the Actions cache, cloning it only on a cache
  miss. Pass the "dir" output to CMake as -DFETCHCONTENT_SOURCE_DIR_JUCE so FetchContent uses it instead of
  cloning JUCE again in every job. The version comes from the GIT_TAG in CMakeLists.txt, so changing it
  there changes the cache key and the next run fetches the new version.
outputs:
  dir:
    description: Directory holding the JUCE source.
    value: ${{ steps.version.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Read JUCE version from CMakeLists.txt
      id: version
      shell: pwsh
      run: |
        $match = Select-String -Path CMakeLists.txt -Pattern 'FetchContent_Declare\(JUCE .*GIT_TAG (\S+)'
        if (-not $match) { throw 'JUCE GIT_TAG not found in CMakeLists.txt' }
        $tag = $match.Matches[0].Groups[1].Value
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "dir=$($env:RUNNER_TEMP)/juce-src-$tag" >> $env:GITHUB_OUTPUT
    - name: Restore JUCE source
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.version.outputs.dir }}
        key: juce-src-${{ steps.version.outputs.tag }}
    - name: Clone JUCE
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        git -c advice.detachedHead=false clone --quiet --depth 1 --branch "${{ steps.version.outputs.tag }}" https://github.com/juce-framework/JUCE.git "${{ steps.version.outputs.dir }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
