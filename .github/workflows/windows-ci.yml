name: Windows C++ CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AlienStudio-${{ matrix.config }}
          path: build/AlienStudio_artefacts/${{ matrix.config }}/*.exe
          if-no-files-found: error
