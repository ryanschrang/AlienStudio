name: Windows C++ CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'roadmap-status.html'
  pull_request:
    # labeled: adding the "capacity" label starts the run that includes the 32/64 build.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'roadmap-status.html'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request (or to main) cancels the run it supersedes: only the latest
# commit's result matters, and a superseded run would otherwise hold runners for hours.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Actions are pinned to the commit their v4 tag pointed at when pinned (the version is in the comment),
# so a moved tag can't change what runs here.
jobs:
  build:
    runs-on: windows-2022
    # Upper bound for a hung job instead of GitHub's 6 hours. Before the shared JUCE library a Release
    # build took up to 4 hours, so this is generous; tighten it once build times settle.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: JUCE source
        id: juce
        uses: ./.github/actions/juce-source
      - name: Configure
        timeout-minutes: 20
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DFETCHCONTENT_SOURCE_DIR_JUCE=${{ steps.juce.outputs.dir }}"
      - name: Build
        id: build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      # --timeout: no single test may run longer than 10 minutes. The slowest, TimelinePlaybackTests in
      # Debug, takes about 2.
      - name: Test
        timeout-minutes: 45
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 600
      # The fault guard regression runs 50 times in a row to catch intermittent failures. It used to be
      # its own pair of jobs that configured and compiled again; here it reuses this job's build, and it
      # still runs when another test failed.
      - name: Fault guard regression (50 runs)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: ctest --test-dir build -R "^FaultGuardTests$" -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 120 --repeat until-fail:50
      - name: Upload Windows Release
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AlienStudio-Windows-Release
          path: |
            build/AlienStudio_artefacts/Release/*.exe
            build/AlienStudio_artefacts/Release/Starter Pack/
          if-no-files-found: error
  # T1-04 C3: the 32-track, 64-scene candidate profile builds and passes every test. It is not the
  # supported release profile (src/SessionCapacity.h); no artifact is uploaded from it.
  # It is a second full Release build, so it runs on main and on request, and on a pull request only
  # when the pull request has the "capacity" label (for changes to track or scene limits).
  capacity-candidate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'capacity')
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: JUCE source
        id: juce
        uses: ./.github/actions/juce-source
      - name: Configure 32x64 profile
        timeout-minutes: 20
        run: cmake -S . -B build-32x64 -G "Visual Studio 17 2022" -A x64 -DALIEN_SESSION_TRACKS=32 -DALIEN_SESSION_SCENES=64 "-DFETCHCONTENT_SOURCE_DIR_JUCE=${{ steps.juce.outputs.dir }}"
      - name: Build
        run: cmake --build build-32x64 --config Release --parallel 4
      - name: Test
        timeout-minutes: 45
        run: ctest --test-dir build-32x64 -C Release --output-on-failure --no-tests=error --timeout 600
      - name: Configure 16x32 comparison profile
        timeout-minutes: 20
        run: cmake -S . -B build-16x32 -G "Visual Studio 17 2022" -A x64 -DALIEN_SESSION_TRACKS=16 -DALIEN_SESSION_SCENES=32 "-DFETCHCONTENT_SOURCE_DIR_JUCE=${{ steps.juce.outputs.dir }}"
      - name: Build 16x32 capacity reports
        run: cmake --build build-16x32 --config Release --target TrackCapacityReport RackIntegrationTests --parallel 4
      - name: Compare capacity profiles on this runner
        timeout-minutes: 30
        shell: pwsh
        run: |
          foreach ($profile in '16x32', '32x64') {
            Write-Host "::group::$profile Release capacity report"
            $bin = "build-$profile/Release"
            & "$bin/TrackCapacityReport.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$bin/RackIntegrationTests.exe" --capacity-report
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
