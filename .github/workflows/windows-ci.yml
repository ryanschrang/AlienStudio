name: Windows C++ CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault-guard:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure fault guard regression
        run: cmake -S . -B build-fault -G "Visual Studio 17 2022" -A x64
      - name: Build fault guard regression
        run: cmake --build build-fault --config ${{ matrix.config }} --target FaultGuardTests
      - name: Test fault guard regression
        run: ctest --test-dir build-fault -R "^FaultGuardTests$" -C ${{ matrix.config }} --output-on-failure --no-tests=error --repeat until-fail:50
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error
      - name: Upload Windows Release
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AlienStudio-Windows-Release
          path: build/AlienStudio_artefacts/Release/*.exe
          if-no-files-found: error
